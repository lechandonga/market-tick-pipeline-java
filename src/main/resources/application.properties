server.port=8080

# ===== 本地行情窗口聚合服务配置 =====
# 原始报文日志目录（只追加本地文件，无外部中间件）
pipeline.data-dir=${PIPELINE_DATA_DIR:./data}
# 固定窗口大小（毫秒），默认 60s
pipeline.window-size-millis=${PIPELINE_WINDOW_SIZE_MILLIS:60000}

# 日志：文件 + 控制台，便于运行单测/服务时从日志确认覆盖的业务场景
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.file.name=${pipeline.data-dir}/pipeline.log
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
